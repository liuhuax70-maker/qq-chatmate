name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 各测试套件分别跑，任何一个挂了都能从 step 名看出来是哪个
      - name: Test smoke
        run: npm run smoke

      - name: Test emoji
        run: npm run test:emoji

      - name: Test sleep
        run: npm run test:sleep

      - name: Test split
        run: npm run test:split

      - name: Test stickers
        run: npm run test:stickers

      - name: Test sticker key
        run: npm run test:stickerkey

      - name: Test prompt
        run: npm run test:prompt
